<!DOCTYPE html>
<html>
<head>
    <title>Вход - CarDrive</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        input { width: 100%; padding: 8px; margin: 5px 0 15px; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
        a { display: block; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Вход</h2>
    <p th:if="${param.error}" style="color:red">Неверный email или пароль</p>
    <p th:if="${param.logout}" style="color:green">Вы вышли из системы</p>
    <p th:if="${param.registered}" style="color:green">Регистрация успешна! Войдите.</p>
    <form method="post">
        <label>Email:</label>
        <input type="email" name="username" required>

        <label>Пароль:</label>
        <input type="password" name="password" required>

        <button type="submit">Войти</button>
    </form>
    <a href="/register">Нет аккаунта? Зарегистрироваться</a>
</div>
</body>
</html>
